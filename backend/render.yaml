services:
  - type: web
    name: fundsroom-erp-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore

    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: FRONTEND_URL
        sync: false

      - key: PORT
        value: 10000

databases:
  - name: fundsroom-db
    plan: free
    region: singapore